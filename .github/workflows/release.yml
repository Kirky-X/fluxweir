#===============================================================================
# Fluxweir 发布流水线（推 v* tag 触发；workflow_dispatch 供恢复/重发）
#
# 产物：GitHub Release 附源码压缩包（自动生成）+ x86_64-linux-musl 静态
# 二进制 + checksums.txt；crates.io 走 OIDC trusted publishing（家族终态），
# 未登记信任发布者时自动退回 CARGO_REGISTRY_TOKEN secret。
# docker 镜像构建（docker/Dockerfile）与本机 `cargo build --locked --release`
# 仍为等价部署路径（镜像构建用本地 ../vecboost，与发布二进制的 registry
# 面可能存在未发布的本地差异）。
#
# 触发面：tag 推送为主；手动重发必须显式给 version 且 tag 已存在（verify
# 做存在性校验）。所有 job（含手动重发路径）一律 checkout tag 指向的
# commit 构建与校验——源码包/二进制/crates.io 包三者同源，防「分支 HEAD
# 构建 + tag 源码包」的幻影发布变体。
#===============================================================================
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本（x.y.z 或 x.y.z-rc.N，不带 v 前缀；须已有对应 tag）'
        required: true
        type: string

permissions:
  # 最小权限默认；唯 create-release 需要 contents: write（job 级显式提升）。
  # 构建作业在容器内执行第三方依赖的 build.rs，不得持有写凭据。
  contents: read

concurrency:
  # 固定组：tag 推送（refs/tags/…）与手动重发（refs/heads/…）是不同 ref，
  # 按 ref 分组会让同版本两条 run 并发建 Release
  group: Release
  cancel-in-progress: false

jobs:
  #-----------------------------------------------------------------------------
  # 两段式前置校验（全链唯一版本真源）：semver 校验、换行清洗、tag 存在性、
  # tag commit 的 manifest 版本一致性、vecboost registry 版本推导。
  # version / vb_version 经 outputs 下发，下游零重复解析。
  #-----------------------------------------------------------------------------
  verify:
    name: Verify tag ↔ manifest version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pre.outputs.version }}
      vb_version: ${{ steps.manifest.outputs.vb_version }}
    steps:
      # 版本解析与校验先于 checkout：非法输入/不存在的 tag 在烧任何构建
      # 资源前失败。输入值经 env 传递，不内插进 run。
      - name: Resolve and validate version
        id: pre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            # 清洗换行后再回显：原值经注解回显时，内嵌换行可伪造工作流命令
            SAFE="${VERSION//$'\n'/%0A}"; SAFE="${SAFE//$'\r'/%0D}"
            echo "::error::非法版本号: ${SAFE}（期望 x.y.z 或 x.y.z-rc.N）"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null \
            || { echo "::error::tag v${VERSION} 不存在——先推送 tag 再重发"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      # 校验读 tag 指向 commit 的 manifest（手动重发时默认分支 HEAD 可能已
      # 前进），与发布产物真正的构建源一致。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ steps.pre.outputs.version }}
          persist-credentials: false
      - name: Check manifest matches tag; derive vecboost version
        id: manifest
        run: |
          VERSION="${{ steps.pre.outputs.version }}"
          MANIFEST="$(grep -m1 '^version = "' Cargo.toml | sed 's/^version = "\([^"]*\)".*/\1/')"
          if [[ -z "$MANIFEST" || "$VERSION" != "$MANIFEST" ]]; then
            echo "::error::tag v${VERSION} 与 tag commit 的 Cargo.toml version=${MANIFEST:-<未解析>} 不一致——以 tag 为准 bump manifest 后重打 tag"
            exit 1
          fi
          # vecboost 的 path+version 双写依赖：发布面（registry 包）版本以
          # tag commit 的 Cargo.lock 锁定值为单一真源（--locked 构建的解析
          # 结果，与下载的 .crate 严格一致），下游 job 不再各自硬编码。
          # 历史教训（v0.1.1 首发实录）：曾从 Cargo.toml 行首 grep
          # `vecboost = {` 提取——a907b58 把依赖收口进 [workspace.dependencies]
          # 后该 grep 命中成员段的 `workspace = true` 声明（无 version 键，
          # sed 不替换原样输出整行），vb_version 变垃圾串致下载 URL
          # malformed（curl exit 3）。lock 段 `name`+`version` 相邻行不受
          # 依赖声明形态影响。
          VB_VERSION="$(grep -A1 '^name = "vecboost"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)"
          if [[ -z "$VB_VERSION" ]]; then
            echo "::error::未能从 Cargo.lock 解析 vecboost 锁定版本"
            exit 1
          fi
          echo "vb_version=${VB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "verify ok: v${VERSION} == manifest ${MANIFEST}; vecboost ${VB_VERSION}"

  #-----------------------------------------------------------------------------
  # musl 静态二进制：与 docker/Dockerfile build 阶段同源（同镜像/apk 清单/
  # default 口径 --locked 构建 + lld 链接）。用 docker run 而非 job 级
  # container——node actions 在 alpine 容器内不可跑。vecboost 从 crates.io
  # 下载（sha256 钉校验，Cargo.lock 对 path 依赖无 checksum 锚点，这是发布
  # 面唯一的完整性锚）后挂到容器内 /vecboost——cargo 相对 /app/Cargo.toml
  # 解析 `path = "../vecboost"` 的落点（挂别处则 --locked 解析期即失败）。
  #-----------------------------------------------------------------------------
  build-binary:
    name: Build musl binary (x86_64)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VB_VERSION: ${{ needs.verify.outputs.vb_version }}
      # vecboost 0.3.0 .crate 包的 sha256（升级 VB_VERSION 时同步更新）
      VB_SHA256: c60f9464a41a5c82c2322cf04238ce1a6c7730149898e362a81fa91b53fc6963
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ needs.verify.outputs.version }}
          persist-credentials: false
      - name: Fetch vecboost from crates.io (pinned sha256)
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail --location \
            "https://crates.io/api/v1/crates/vecboost/${VB_VERSION}/download" -o /tmp/vb.crate
          echo "${VB_SHA256}  /tmp/vb.crate" | sha256sum -c --strict -
          mkdir -p ../vbtmp && tar -xzf /tmp/vb.crate -C ../vbtmp
          mv "../vbtmp/vecboost-${VB_VERSION}" ../vecboost
      - name: Build in alpine container
        # 镜像/apk 清单与 docker/Dockerfile build 阶段同步维护（dependabot 只解析 Dockerfile）
        run: |
          docker run --rm \
            -v "$PWD":/app -w /app \
            -v "$GITHUB_WORKSPACE/../vecboost":/vecboost \
            docker.io/library/rust:1.99-alpine3.24 \
            sh -c "apk add --no-cache clang lld musl-dev pkgconfig sqlite-dev && RUSTFLAGS='-C link-arg=-fuse-ld=lld' cargo build --locked --release --bin fluxweir"
      - name: Package with checksums
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cp target/release/fluxweir "fluxweir-${VERSION}-x86_64-linux-musl"
          tar -czf "fluxweir-${VERSION}-x86_64-linux-musl.tar.gz" "fluxweir-${VERSION}-x86_64-linux-musl"
          sha256sum "fluxweir-${VERSION}-x86_64-linux-musl.tar.gz" > checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: musl-binary
          path: |
            fluxweir-*-x86_64-linux-musl.tar.gz
            checksums.txt
          retention-days: 3

  #-----------------------------------------------------------------------------
  # 创建 GitHub Release（自动生成变更说明；rc/beta/alpha 后缀标记预发布）。
  # 版本校验全部在 verify 完成，本 job 只消费 outputs；无源码检出需求。
  # 家族终态：gh release 脚本步替代 action-gh-release（zizmor superfluous，
  # CodeNexus run 43629773752 先例），幂等（已存在仅刷新产物）、prerelease
  # 按 semver 自动判定、uniqueness 断言仅对 tag 推送路径生效。
  #-----------------------------------------------------------------------------
  create-release:
    needs: [verify, build-binary]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download musl binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: musl-binary
          path: dist
      - name: Create GitHub Release (idempotent)
        # TAG 经 env 传入、不内插进 run 块（template-injection 向量）；显式 tag
        # 由 verify 输出决定：手动触发时 GITHUB_REF 是分支，不显式指定会落错 ref。
        # GH_REPO 必须显式给：本 job 无 checkout（无 git 仓库上下文），gh release
        # 子命令靠它解析 repo（dispatch run 43687203194 实录：缺它报
        # "failed to run git: fatal: not a git repository"）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.verify.outputs.version }}
        run: |
          VERSION="${TAG#v}"
          ARGS=(--generate-notes)
          # 预发布判定跟 semver 语义走：版本含 '-' 即预发布（rc/beta/alpha 等）
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          # find 收集（bash 无 globstar：dist/**/* 会漏一级目录的 checksums.txt）
          FILES=$(find dist -type f | tr '\n' ' ')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; skip creation, refresh artifacts only (idempotent)"
            # shellcheck disable=SC2086
            gh release upload "$TAG" $FILES --clobber
            exit 0
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" $FILES "${ARGS[@]}"

      # uniqueness 断言（最终一致性窗口轮询 5×3s——家族先例 CodeNexus v0.4.0：
      # create 后列表端点短暂读到 0 致断言误杀）。仅 tag 推送路径生效；dispatch
      # 重跑跑在分支上无新 tag 可断言，幂等性由 create 步的 gh release view 守卫承担。
      - name: Verify release uniqueness
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.verify.outputs.version }}
        run: |
          COUNT=0
          for i in 1 2 3 4 5; do
            COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
            echo "try${i}: release objects for ${TAG}: ${COUNT}"
            if [ "${COUNT}" = "1" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT} after 5 retries; release state is not idempotent"
          exit 1

  #-----------------------------------------------------------------------------
  # crates.io trusted publishing（OIDC，家族终态）：rust-lang/crates-io-auth-action
  # 以 Actions OIDC 换 30 分钟短时凭证，无需长生命期 secret；crates.io 未登记
  # 本仓信任发布者时该步失败（continue-on-error）自动退回 CARGO_REGISTRY_TOKEN
  # secret。已发布版本（手动重发场景）幂等跳过。vecboost 就位与校验同
  # build-binary。发布后 6×20s 轮询硬校验版本可见（403 未就绪/索引延迟不算成功）。
  #-----------------------------------------------------------------------------
  publish-crate:
    name: Publish fluxweir to crates.io (OIDC + token fallback)
    needs: [verify, build-binary, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing 凭证交换
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      VB_VERSION: ${{ needs.verify.outputs.vb_version }}
      VB_SHA256: c60f9464a41a5c82c2322cf04238ce1a6c7730149898e362a81fa91b53fc6963
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ needs.verify.outputs.version }}
          persist-credentials: false
      - name: Fetch vecboost from crates.io (pinned sha256)
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail --location \
            "https://crates.io/api/v1/crates/vecboost/${VB_VERSION}/download" -o /tmp/vb.crate
          echo "${VB_SHA256}  /tmp/vb.crate" | sha256sum -c --strict -
          mkdir -p ../vbtmp && tar -xzf /tmp/vb.crate -C ../vbtmp
          mv "../vbtmp/vecboost-${VB_VERSION}" ../vecboost
      # 幂等：已发布版本直接跳过，避免重跑撞 "already exists"；查询异常显式失败
      - name: Check already published
        id: published
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "fluxweir-release" "https://crates.io/api/v1/crates/fluxweir/${VERSION}")
          echo "fluxweir ${VERSION}: HTTP ${CODE}"
          [[ "$CODE" == "200" || "$CODE" == "404" ]] || { echo "::error::crates.io 查询异常: HTTP ${CODE}"; exit 1; }
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # 家族终态：OIDC 优先；未登记信任发布者时失败（continue-on-error），
      # 后续 publish 自动退回 CARGO_REGISTRY_TOKEN（注册后可删兜底分支）。
      - name: Authenticate to crates.io (OIDC)
        id: auth
        if: steps.published.outputs.exists == 'false'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish (idempotent)
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::无 crates.io 凭证：OIDC 交换失败且 CARGO_REGISTRY_TOKEN secret 为空"
            exit 1
          fi
          cargo publish -p fluxweir --locked --registry crates-io
      # 版本硬校验：防静默漏发（403 未就绪/404 索引未刷新都继续轮询，200 才算成功）
      - name: Verify on crates.io
        if: always()
        run: |
          ok=""; CODE=""
          for i in 1 2 3 4 5 6; do
            sleep 20
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "fluxweir-release" "https://crates.io/api/v1/crates/fluxweir/${VERSION}")
            echo "try$i: HTTP ${CODE}"
            if [[ "$CODE" == "200" ]]; then ok=1; break; fi
            if [[ "$CODE" != "403" && "$CODE" != "404" ]]; then break; fi
          done
          if [[ -z "$ok" ]]; then
            echo "::error::fluxweir ${VERSION} 未出现在 crates.io（HTTP ${CODE}）"
            exit 1
          fi
