# 安全检查补充 workflow
# 由统一护栏配置生成（2026-10-20）。只包含本仓现有 CI 尚未覆盖的检查，
# 不改动既有 workflow，避免与已有 job 重复。
name: security
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 重复推送取消在跑的同 ref 扫描（与 ci.yml / feature-matrix.yml 同口径）
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    # 与其余 job 一致：gitleaks/trivy/zizmor 任一挂起不得无限占用 runner
    timeout-minutes: 10
    steps:
      # 写法对齐 vecboost/garrison/CodeNexus 同一 workflow：SHA 钉 + fetch-depth: 0。
      # 浅克隆会让 gitleaks-action 的 `<head>^..<head>` 区间无法解析（报
      # "unknown revision" 后空转退 1），@v4 同时是 zizmor 的 unpinned-uses 发现项。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        # 第三方 docker action 钉 digest：tag 可变，上游可静默换镜像。
        # 版本 1.7.12（Docker Hub 无 v 前缀）；digest 为 1.7.12 多架构索引。
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          # shellcheck 子检查降到 error 级：YAML 语法/表达式错误仍阻断，
          # 风格级（SC2086/SC2034 等）不阻断，避免打断既有流水线。
          args: -color -shellcheck=error
      - name: zizmor (GitHub Actions 安全审计)
        # 版本修正（外部事实）：`v0.12.0` 在 zizmorcore/zizmor-action 仓库不存在
        # （API 核对 tags 最高到 v0.7.1），作业在 "Getting action download info"
        # 阶段就红，`continue-on-error` 对这种 action 解析失败无效（garrison
        # 同缺陷已证实）。改用 SHA 钉的 v0.7.1；本仓既有 workflow 的
        # unpinned-uses backlog 未清零，保留非阻断语义。
        continue-on-error: true
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      - name: gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # v3 起强制要求（PR 扫描鉴权），缺失即 job 红且跳过扫描
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      # 不引入 cargo-vet：`cargo vet verify` 以仓库根存在 supply-chain/（vet.toml /
      # imports.lock）为前提，本仓没有该目录，保留只会必红。依赖来源审计由
      # ci.yml 已有的 cargo-audit + cargo-deny 承担（vecboost/CodeNexus 同口径）。
      - name: trivy (文件系统/依赖漏洞)
        # 可变引用（`@master`）换 SHA 钉的 v0.36.0：tag 可被上游重指，SHA 不可。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
