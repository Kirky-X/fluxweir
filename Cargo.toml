[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# 工作区依赖单一事实源：版本只在此声明，成员一律 `workspace = true` 继承；features 留在
# 成员侧（`--workspace` 统一构建时仍由 Cargo 按目标取并集）。版本格式 x.y（兼容范围，禁止
# patch 段）；依赖线本身处于预发布期时无法用 x.y 表达，保留完整预发布号。default-features 统一 false。
[workspace.dependencies]
axum = { version = "0.8", default-features = false }
tokio = { version = "1.54", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }

dbnexus = { version = "0.6.0-rc.11", default-features = false }
sea-orm = { version = "2.0", default-features = false }

inklog = { version = "0.3.0-rc.12", default-features = false }
confers = { version = "0.6.0-rc.13", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-log = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }

limiteron = { version = "0.3.0-rc.10", default-features = false }
oxcache = { version = "0.5.0-rc.12", default-features = false }
# 兄弟库 path 依赖：跟随本地 checkout（0.3.0-rc.3 已发布，本地 checkout 领先两个提交）；
# 本地改动发布后改回 registry 依赖。
vecboost = { path = "../vecboost", version = "0.3.0-rc.3", default-features = false }
trait-kit = { version = "0.5.0-rc.13", default-features = false }
sdforge = { version = "0.5.0-rc.10", default-features = false }

serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
async-trait = { version = "0.1", default-features = false }
futures = { version = "0.3", default-features = false }
chrono = { version = "0.4", default-features = false }
rand = { version = "0.10", default-features = false }
once_cell = { version = "1.21", default-features = false }
uuid = { version = "1.29", default-features = false }
url = { version = "2.5", default-features = false }
bytes = { version = "1.12", default-features = false }
reqwest = { version = "0.13", default-features = false }
eventsource-stream = { version = "0.2", default-features = false }
async-channel = { version = "2.5", default-features = false }
async-stream = { version = "0.3", default-features = false }
dashmap = { version = "6.2", default-features = false }
toml = { version = "1.2", default-features = false }
unic-langid = { version = "0.9", default-features = false }
sys-locale = { version = "0.3", default-features = false }
sha2 = { version = "0.11", default-features = false }
hex = { version = "0.4", default-features = false }
subtle = { version = "2.6", default-features = false }

cocoon = { version = "0.5", default-features = false }
secrecy = { version = "0.10", default-features = false }
opentelemetry = { version = "0.33", default-features = false }
opentelemetry_sdk = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false }
rust-embed = { version = "8.13", default-features = false }
jsonwebtoken = { version = "11.1", default-features = false }

fluent-syntax = { version = "0.12", default-features = false }
log = { version = "0.4", default-features = false }
tempfile = { version = "3.27", default-features = false }
http-body = { version = "1.1", default-features = false }
futures-util = { version = "0.3", default-features = false }
mockito = { version = "1.7", default-features = false }
criterion = { version = "0.8", default-features = false }

anyhow = { version = "1.0", default-features = false }
tonic = { version = "0.14", default-features = false }
tonic-prost = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false }
tonic-build = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14", default-features = false }

# 工作区内部路径依赖：示例成员消费，随 examples `publish = false` 不对外发布。
fluxweir = { path = ".", default-features = false }

# 本地 checkout 领先已发布版本时才保留 path 开发态：path 版与 registry 版并存会 trait 身份分裂。

[workspace]
# 示例集合并为单一 crate（examples/），内部按 feature 划分模块与 bin。
members = [
    "examples",
]
